[package]
name = "syntaks"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "syntaks"
path = "src/main.rs"

[[bin]]
name = "tinue"
path = "src/bin/tinue.rs"

[[bin]]
name = "genpos"
path = "src/bin/genpos.rs"

[features]
pext = []

[dependencies]
arrayvec = "0.7.6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
atomic-wait = "1.1.0"
static_init = "1.0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Release-profile tuning. Single codegen unit + fat LTO gives the optimizer
# whole-program visibility; on wasm32 in particular this collapses many of
# the abstraction layers (Bitboard, Position::apply_move, etc.) that the
# default many-codegen-unit build leaves as unattributed indirect calls.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
